        function getVisibleUsers() {
            const filtered = data.users.filter(u => {
                if (excludedUsers.has(u.email)) return false;
                const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? u[p] : 0), 0);
                return total > 0;
            });
            
            if (sortMode === 'alphabetical') {
                return filtered.sort((a, b) => a.email.localeCompare(b.email));
            }
            return filtered;
        }

        function getGroupedUsers() {
            return getVisibleUsers().filter(u => {
                const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? u[p] : 0), 0);
                return total <= groupThreshold && groupThreshold > 0;
            }).sort((a, b) => {
                const totalA = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? a[p] : 0), 0);
                const totalB = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? b[p] : 0), 0);
                return totalB - totalA;
            });
        }

        function getInactiveUsers() {
            return data.users.filter(u => {
                if (excludedUsers.has(u.email)) return false;
                const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? u[p] : 0), 0);
                return total === 0;
            });
        }

        function getExcludedUsers() {
            return Array.from(excludedUsers)
                .map(email => data.users.find(u => u.email === email))
                .filter(u => u)
                .sort((a, b) => a.email.localeCompare(b.email));

        function getUnlicensedUsers() {

        function getUnlistedLicensedUsers() {
            const chartEmails = new Set(data.users.map(u => u.email.toLowerCase()));

        function formatData() {
            const visibleUsers = getVisibleUsers();
            const grouped = getGroupedUsers();
            const regular = visibleUsers.filter(u => {
                const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? u[p] : 0), 0);

            let finalUsers = regular;

                    groupedData[p] = grouped.reduce((sum, u) => sum + u[p], 0);
                });
                finalUsers.push(groupedData);
            }

            return finalUsers;

            const tooltip = document.getElementById('pieTooltip');
            const pieChartCanvas = document.getElementById('pieChart');
            
            if (!pieChartCanvas) return;
            
            const chartData = [];
            const chartLabels = [];
            const chartColors = [];
            
            data.products.forEach(product => {
                const amount = user[product] || 0;
                if (amount > 0 && visibleProducts.has(product)) {
                    chartLabels.push(product);
                    chartData.push(amount);
                    chartColors.push(productColors[product]);
                }
            });
            
            document.getElementById('pieTitle').textContent = user.email.split('@')[0];
            
            if (pieChart) {
                pieChart.destroy();
            }
            
            const total = chartData.reduce((a, b) => a + b, 0);
            
            pieChart = new Chart(pieChartCanvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        data: chartData,
                        backgroundColor: chartColors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 10 },
                                padding: 6,
                                boxWidth: 8,
                                generateLabels: (chart) => {
                                    const data = chart.data;
                                    return data.labels.map((label, i) => ({
                                        text: label + ' (' + ((data.datasets[0].data[i] / total) * 100).toFixed(0) + '%)',
                                        fillStyle: data.datasets[0].backgroundColor[i],
                                        hidden: false,
                                        index: i
                                    }));
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const pct = ((context.parsed / total) * 100).toFixed(1);
                                    return '$' + context.parsed.toFixed(2) + ' (' + pct + '%)';
                                }
                            }
                        }
                    }
                }
            });
            
            tooltip.style.display = 'block';
            tooltip.style.left = Math.min(x, window.innerWidth - 280) + 'px';
            tooltip.style.top = (y - 20) + 'px';
        }

        function hidePieChart() {
            const tooltip = document.getElementById('pieTooltip');
            tooltip.style.display = 'none';
        }

        function renderChart() {
            const finalUsers = formatData();
            const visibleDatasets = data.products
                .filter(p => visibleProducts.has(p))
                .map(product => ({
                    label: product,
                    data: finalUsers.map(u => u[product] || 0),
                    backgroundColor: productColors[product] || '#999',
                    borderWidth: 0
                }));
            
            const ctx = document.getElementById('usageChart');
            if (!ctx) return;
            
            const canvasContext = ctx.getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            const scaleType = logScale ? 'logarithmic' : 'linear';
            const labels = finalUsers.map(u => {
                const isLicensed = licensedEmails.has(u.email.toLowerCase());
                const displayName = u.email.split('@')[0];
                return displayName;
            });
            
            chart = new Chart(canvasContext, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: visibleDatasets
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        x: {
                            stacked: true,
                            type: scaleType,
                            ticks: { callback: v => '$' + v.toFixed(0) }
                        },
                        y: {
                            stacked: true,
                            ticks: {
                                color: function(context) {
                                    const user = finalUsers[context.index];
                                    if (user && !licensedEmails.has(user.email.toLowerCase())) {
                                        return '#e74c3c';
                                    }
                                    return '#333';
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            enabled: true,
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: { size: 13, weight: 'bold' },
                            bodyFont: { size: 12 },
                            callbacks: {
                                title: (tooltipItems) => {
                                    if (tooltipItems.length > 0) {
                                        return tooltipItems[0].label;
                                    }
                                    return '';
                                },
                                afterTitle: () => {
                                    return '';
                                },
                                label: (context) => {
                                    const user = finalUsers[context.dataIndex];
                                    const product = context.dataset.label;
                                    const amount = user[product] || 0;
                                    
                                    if (amount > 0) {
                                        return product + ': $' + amount.toFixed(2);
                                    }
                                    return '';
                                },
                                filter: (context) => {
                                    const user = finalUsers[context.dataIndex];
                                    const product = context.dataset.label;
                                    const amount = user[product] || 0;
                                    return amount > 0;
                                }
                            }
                        }
                    },
                    onHover: (event, activeElements) => {
                        const canvas = event.native.target;
                        if (activeElements.length > 0 && event.type === 'mousemove') {
                            const canvasRect = canvas.getBoundingClientRect();
                            const index = activeElements[0].index;
                            const user = finalUsers[index];
                            const shouldShow = ctrlPressed ? !pieChartEnabled : pieChartEnabled;
                            if (shouldShow) {
                                showPieChart(user, event.native.clientX, event.native.clientY);
                            } else {
                                hidePieChart();
                            }
                        } else if (event.type === 'mouseleave') {
                            hidePieChart();
                        }
                    },
                    onClick: (event, elements) => {
                        if (elements && elements.length > 0) {
                            const index = elements[0].index;
                            const user = finalUsers[index];
                            if (user && !user.email.startsWith('[')) {
                                hidePieChart();
                                excludeUser(user.email);
                            }
                        }
                    }
                }
            });

            updateSidebar();
        }

        function updateSidebar() {
            updateGroupedList();
            updateInactiveList();
            updateExcludedPanel();
            updateUnlicensedPanel();
        }

        function updateGroupedList() {
            const grouped = getGroupedUsers();
            const section = document.getElementById('groupedSection');
            const list = document.getElementById('groupedList');

            if (grouped.length === 0 || groupThreshold === 0) {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                list.innerHTML = grouped.map(u => {
                    const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? u[p] : 0), 0);
                    const isLicensed = licensedEmails.has(u.email.toLowerCase());
                    const className = isLicensed ? '' : ' unlicensed';
                    return `<div class="list-item${className}"><div class="list-item-content">${u.email.split('@')[0]}<span class="list-item-amount">$${total.toFixed(2)}</span></div><button class="list-item-remove" onclick="excludeUser('${u.email}')" title="Remove">✕</button></div>`;
                }).join('');
            }
        }

        function updateInactiveList() {
            const inactive = getInactiveUsers();
            const section = document.getElementById('inactiveSection');
            const list = document.getElementById('inactiveList');

            if (inactive.length === 0) {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                list.innerHTML = inactive.map(u => {
                    const isLicensed = licensedEmails.has(u.email.toLowerCase());
                    const className = isLicensed ? '' : ' unlicensed';
                    return `<div class="list-item${className}"><div class="list-item-content">${u.email.split('@')[0]}</div><button class="list-item-remove" onclick="excludeUser('${u.email}')" title="Remove">✕</button></div>`;
                }).join('');
            }
        }

        function updateExcludedPanel() {
            const excluded = getExcludedUsers();
            const panel = document.getElementById('excludedPanel');
            const grid = document.getElementById('excludedGrid');

            if (excluded.length === 0) {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
                grid.innerHTML = excluded.map(u => {
                    const total = data.products.reduce((sum, p) => sum + u[p], 0);
                    return `<div class="excluded-card"><div class="excluded-name">${u.email.split('@')[0]}</div><button class="excluded-restore" onclick="restoreUser('${u.email}')">Restore</button></div>`;
                }).join('');
            }
        }

        function updateUnlicensedPanel() {
            const unlisted = getUnlistedLicensedUsers();
            const panel = document.getElementById('unlicensedPanel');
            const grid = document.getElementById('unlicensedGrid');

            if (unlisted.length === 0) {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
                grid.innerHTML = unlisted.map(email => {
                    return `<div class="unlicensed-item">${email.split('@')[0]}</div>`;
                }).join('');
            }
        }

        function setupControls() {
            const controlsDiv = document.getElementById('controls');
            if (!controlsDiv) return;
            
            data.products.forEach(product => {
                const item = document.createElement('div');
                item.className = 'checkbox-item';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'product-' + product;
                checkbox.checked = true;
                
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        visibleProducts.add(product);
                    } else {
                        visibleProducts.delete(product);
                    }
                    renderChart();
                });
                
                const label = document.createElement('label');
                label.htmlFor = 'product-' + product;
                
                const colorBox = document.createElement('span');
                colorBox.className = 'color-box';
                colorBox.style.backgroundColor = productColors[product];
                
                label.appendChild(colorBox);
                label.appendChild(document.createTextNode(product));
                
                item.appendChild(checkbox);
                item.appendChild(label);
                controlsDiv.appendChild(item);
            });
        }

        function initializeApp() {
            setupControls();
            renderChart();
        }

        document.getElementById('sortBy').addEventListener('change', (e) => {
            sortMode = e.target.value;
            renderChart();
        });

        document.getElementById('logScale').addEventListener('change', (e) => {
            logScale = e.target.checked;
            renderChart();
        });

        document.getElementById('enablePieChart').addEventListener('change', (e) => {
            pieChartEnabled = e.target.checked;
        });

        document.getElementById('groupThreshold').addEventListener('input', (e) => {
            groupThreshold = parseInt(e.target.value);
            document.getElementById('groupValue').textContent = '$' + groupThreshold;
            renderChart();
        });

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
