    <div class="container">

        <div class="header">
            <h1>Claude Usage Analysis</h1>
            <div class="csv-upload">
                <!-- File input for selecting CSV -->
                <input type="file" id="csvFile" class="csv-input" accept=".csv" />

                <!-- Status message shown after upload -->
                <span id="statusMsg" class="status-msg"></span>
            </div>
        </div>
        
        <div class="top-row">
            <!-- Main chart area -->
            <div class="main">
                <!-- Pie chart tooltip that shows product breakdown on bar hover -->
                <div class="pie-tooltip" id="pieTooltip">
                    <h3 id="pieTitle"></h3>
                    <div class="pie-chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
                <!-- Horizontal stacked bar chart -->
                <div class="chart-wrapper">
                    <canvas id="usageChart"></canvas>
                </div>
            </div>
            
            <!-- Right sidebar with filters and controls -->
            <div class="sidebar">
                <!-- Product filter checkboxes -->
                <h2>Filters</h2>
                <div class="controls" id="controls"></div>
                
                <!-- View options for chart display -->
                <h2>View Options</h2>
                
                <!-- Sort by dropdown: spend or alphabetical or department -->
                <div class="control-group">
                    <label for="sortBy">Sort by</label>
                    <select id="sortBy">
                        <option value="spend">Spend (low to high)</option>
                        <option value="alphabetical">Alphabetical (A-Z)</option>
                        <option value="department">Department</option>
                    </select>
                </div>
                
                <!-- Toggle logarithmic scale for x-axis -->
                <div class="control-group">
                    <div class="toggle">
                        <input type="checkbox" id="logScale" />
                        <label for="logScale">Logarithmic scale</label>
                    </div>
                </div>
                
                <!-- Toggle pie chart on hover -->
                <div class="control-group">
                    <div class="toggle">
                        <input type="checkbox" id="enablePieChart" checked />
                        <label for="enablePieChart">Pie chart on hover</label>
                    </div>
                </div>
                
                <!-- Slider to group low-spend users together -->
                <div class="control-group">
                    <label for="groupThreshold">Group users under $</label>
                    <div class="slider-container">
                        <input type="range" id="groupThreshold" min="0" max="500" value="0" step="10" />
                        <span class="slider-value" id="groupValue">$0</span>
                    </div>
                </div>
                
                <!-- Section showing grouped users (appears when slider > 0) -->
                <div class="info-section" id="groupedSection" style="display: none;">
                    <h3>Grouped users</h3>
                    <div class="list" id="groupedList"></div>
                </div>
                
                <!-- Section showing users with zero spend in selected products -->
                <div class="info-section" id="inactiveSection" style="display: none;">
                    <h3>No usage</h3>
                    <div class="list" id="inactiveList"></div>
                </div>
            </div>
        </div>
        
        <!-- Panel showing manually excluded users with restore buttons -->
        <div class="excluded-panel" id="excludedPanel" style="display: none;">
            <h2>Excluded users (click restore to add back)</h2>
            <div class="excluded-grid" id="excludedGrid"></div>
        </div>
        
        <!-- Panel showing licensed users who don't appear on chart -->

            <h2>Licensed users not shown on chart</h2>
            <div class="unlicensed-grid" id="unlicensedGrid"></div>
        </div>

        // ============ CSV UPLOAD HANDLER ============
        // Listen for upload button click to process CSV file
        document.getElementById('uploadBtn').addEventListener('click', () => {
            // Get selected file
            const file = document.getElementById('csvFile').files[0];
            if (!file) {
                alert('Select a CSV file first');
                return;
            }

            // Read file as text
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    // Parse CSV: split by newlines, then by commas
                    const csv = e.target.result;
                    const lines = csv.split('\n');
                    const headers = lines[0].split(',').map(h => h.trim());
                    
                    // Find column indices - handle both "user_email" and "Email"
                    // This makes the uploader flexible for different CSV formats
                    const emailIndex = headers.findIndex(h => h.toLowerCase() === 'user_email' || h.toLowerCase() === 'email address [required]');
                    const productIndex = headers.findIndex(h => h.toLowerCase() === 'product');
                    const spendIndex = headers.findIndex(h => h.toLowerCase() === 'total_net_spend_usd' || h.toLowerCase() === 'total_gross_spend_usd');
                    const deptIndex = headers.findIndex(h => h.toLowerCase() === 'department');
                    
                    // Validate required columns exist for spend data
                    if (emailIndex === -1 || productIndex === -1 || spendIndex === -1) {
                        alert('CSV must have columns: email/user_email, product, and spend amount');
                        return;
                    }
                    
                    // Aggregate spending data from CSV
                    const newStats = {}; // Track spending by email and product
                    const newProducts = new Set(); // Track unique products
                    const newDepts = {}; // Track departments
                    
                    // Loop through each data row
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue; // Skip empty lines
                        
                        // Split by comma (basic CSV parsing)
                        const cols = line.split(',');
                        const email = cols[emailIndex].trim().toLowerCase();
                        const product = productIndex !== -1 ? cols[productIndex].trim() : null;
                        const spend = spendIndex !== -1 ? parseFloat(cols[spendIndex].trim()) || 0 : 0;
                        const dept = deptIndex !== -1 ? cols[deptIndex].trim() : "Unknown";
                        
                        // Skip rows with missing email
                        if (!email) continue;
                        
                        // Store department
                        if (!newDepts[email]) newDepts[email] = dept;
                        
                        // If CSV has product/spend columns, process spending
                        if (product) {
                            // Initialize user if first time seeing them
                            if (!newStats[email]) newStats[email] = {};
                            // Aggregate spending (handles multiple rows per email/product)
                            newStats[email][product] = (newStats[email][product] || 0) + spend;
                            // Add product to set
                            newProducts.add(product);
                        }
                    }
                    
                    // If no spend data found, try to keep existing products
                    if (newProducts.size === 0) {
                        newProducts.addAll(data.products);
                    }
                    
                    // Replace data object with new aggregated stats
                    data.users = Object.keys(newStats).map(email => {
                        const initials = email.split('@')[0].substring(0, 2).toUpperCase();
                        return {
                            email: email,
                            initials: initials,
                            department: newDepts[email] || "Unknown",
                            ...newStats[email]
                        };
                    });
                    
                    // Update product list and reshow all products in filters
                    data.products = Array.from(newProducts).sort();
                    visibleProducts.clear();
                    data.products.forEach(p => visibleProducts.add(p));
                    
                    // Clear file input and show success message
                    document.getElementById('csvFile').value = '';
                    document.getElementById('statusMsg').textContent = '✓ Data updated';
                    // Auto-hide success message after 2 seconds
                    setTimeout(() => {
                        document.getElementById('statusMsg').textContent = '';
                    }, 2000);
                    
                    // Redraw entire UI with new data
                    renderChart();
                } catch (err) {
                    alert('Error parsing CSV: ' + err.message);
                }
            };
            reader.readAsText(file);
        });

        // ============ DATA FILTERING FUNCTIONS ============
        // Get users with non-zero spend in selected products, applying sort mode
        function getVisibleUsers() {
            // Filter out excluded users, keep only those with spend > 0
            const filtered = data.users.filter(u => {
                if (excludedUsers.has(u.email)) return false;
                // Sum spending across visible products
                const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? (u[p] || 0) : 0), 0);
                return total > 0;
            });
            
            // Sort by selection: spend, alphabetical (by initials), or department
            if (sortMode === 'alphabetical') {
                return filtered.sort((a, b) => a.initials.localeCompare(b.initials));
            } else if (sortMode === 'department') {
                return filtered.sort((a, b) => {
                    // Primary sort by department, secondary by spend within dept
                    if (a.department !== b.department) {
                        return a.department.localeCompare(b.department);
                    }
                    const totalA = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? (a[p] || 0) : 0), 0);
                    const totalB = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? (b[p] || 0) : 0), 0);
                    return totalB - totalA;
                });
            }
            return filtered; // Already sorted by spend from data
        }

        // Get users whose total spend falls below groupThreshold
        function getGroupedUsers() {
            return getVisibleUsers().filter(u => {
                const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? (u[p] || 0) : 0), 0);
                return total <= groupThreshold && groupThreshold > 0;
            }).sort((a, b) => {
                // Sort grouped users by descending spend
                const totalA = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? (a[p] || 0) : 0), 0);
                const totalB = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? (b[p] || 0) : 0), 0);
                return totalB - totalA;
            });
        }

        // Get users with zero spend in all visible products
        function getInactiveUsers() {
            return data.users.filter(u => {
                if (excludedUsers.has(u.email)) return false;
                const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? (u[p] || 0) : 0), 0);
                return total === 0;
            });
        }

        // Get currently excluded users (for restore panel)
        function getExcludedUsers() {
            return Array.from(excludedUsers)
                .map(email => data.users.find(u => u.email === email))
                .filter(u => u)
                .sort((a, b) => a.initials.localeCompare(b.initials));

        // ============ CHART DATA FORMATTING ============
        // Format data for chart display: apply grouping, sorting, filtering
        function formatData() {
            // Get users with spend > 0
            const visibleUsers = getVisibleUsers();
            // Get users below grouping threshold
            const grouped = getGroupedUsers();
            // Get regular users above threshold
            const regular = visibleUsers.filter(u => {
                const total = data.products.reduce((sum, p) => sum + (visibleProducts.has(p) ? (u[p] || 0) : 0), 0);
                return total > groupThreshold || groupThreshold === 0;
            });

            let finalUsers = regular;

            // If grouping is enabled and there are grouped users, create aggregate row
            if (grouped.length > 0) {
                const groupedData = { initials: `[${grouped.length}]`, email: "grouped", department: "Grouped" };
                // Sum all products for grouped users
                data.products.forEach(p => {
                    groupedData[p] = grouped.reduce((sum, u) => sum + (u[p] || 0), 0);
                });
                finalUsers.push(groupedData);
            }

            return finalUsers;
        }

        // ============ PIE CHART DISPLAY ============
        // Show pie chart tooltip with product breakdown for hovered user
        function showPieChart(user, x, y) {
            if (!pieChartEnabled) return; // Exit if pie chart disabled
            
            const tooltip = document.getElementById('pieTooltip');
            const pieChartCanvas = document.getElementById('pieChart');
            
            if (!pieChartCanvas) return;
            
            // Prepare data for pie chart: only visible products with spend > 0
            const chartData = [];
            const chartLabels = [];
            const chartColors = [];
            
            data.products.forEach(product => {
                const amount = user[product] || 0;
                // Include product only if it's visible and has spend
                if (amount > 0 && visibleProducts.has(product)) {
                    chartLabels.push(product);
                    chartData.push(amount);
                    chartColors.push(productColors[product]);
                }
            });
            
            // Show initials and department in tooltip title
            document.getElementById('pieTitle').textContent = user.initials + ' (' + user.department + ')';
            
            // Destroy previous pie chart if exists (avoid memory leaks)
            if (pieChart) {
                pieChart.destroy();
            }
            
            // Calculate total for percentage calculations
            const total = chartData.reduce((a, b) => a + b, 0);
            
            // Create new pie chart instance
            pieChart = new Chart(pieChartCanvas.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        data: chartData,
                        backgroundColor: chartColors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { size: 10 },
                                padding: 6,
                                boxWidth: 8,
                                // Generate custom legend labels with percentages
                                generateLabels: (chart) => {
                                    const data = chart.data;
                                    return data.labels.map((label, i) => ({
                                        text: label + ' (' + ((data.datasets[0].data[i] / total) * 100).toFixed(0) + '%)',
                                        fillStyle: data.datasets[0].backgroundColor[i],
                                        hidden: false,
                                        index: i
                                    }));
                                }
                            }
                        },
                        // Tooltip callback for hover values
                        tooltip: {
                            callbacks: {
                                label: (context) => {
                                    const pct = ((context.parsed / total) * 100).toFixed(1);
                                    return '$' + context.parsed.toFixed(2) + ' (' + pct + '%)';
                                }
                            }
                        }
                    }
                }
            });
            
            // Position tooltip at cursor
            tooltip.style.display = 'block';
            tooltip.style.left = Math.min(x, window.innerWidth - 280) + 'px';
            tooltip.style.top = (y - 20) + 'px';
        }

        // Hide pie chart tooltip

            const tooltip = document.getElementById('pieTooltip');
            tooltip.style.display = 'none';
        }

        // ============ MAIN CHART RENDERING ============
        // Destroy old chart and render new bar chart with current data
        function renderChart() {
            // Format data with grouping and filtering applied
            const finalUsers = formatData();
            
            // Create dataset for each visible product
            const visibleDatasets = data.products
                .filter(p => visibleProducts.has(p))
                .map(product => ({
                    label: product,
                    // Get spend amount for each user (0 if not present)
                    data: finalUsers.map(u => u[product] || 0),
                    backgroundColor: productColors[product] || '#999',
                    borderWidth: 0
                }));
            
            // Get canvas element
            const ctx = document.getElementById('usageChart');
            if (!ctx) return;
            
            const canvasContext = ctx.getContext('2d');
            
            // Destroy previous chart if exists
            if (chart) {
                chart.destroy();
            }
            
            // Determine scale type based on logScale toggle
            const scaleType = logScale ? 'logarithmic' : 'linear';
            // Display anonymized initials instead of full names
            const labels = finalUsers.map(u => u.initials);
            
            // Create bar chart
            chart = new Chart(canvasContext, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: visibleDatasets
                },
                options: {
                    indexAxis: 'y', // Horizontal bars
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index', // Show tooltip for all datasets at hover
                        intersect: false
                    },
                    scales: {
                        x: {
                            stacked: true, // Stack products side by side
                            type: scaleType, // Linear or logarithmic
                            ticks: { callback: v => '$' + v.toFixed(0) } // Format as currency
                        },
                        y: {
                            stacked: true,
                            // Color unlicensed users red
                            ticks: {
                                color: function(context) {
                                    const user = finalUsers[context.index];
                                    if (user && !licensedEmails.has(user.email.toLowerCase())) {
                                        return '#e74c3c'; // Red for unlicensed
                                    }
                                    return '#333'; // Default color
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false }, // Hide legend (too many products)
                        tooltip: {
                            enabled: true,
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: { size: 13, weight: 'bold' },
                            bodyFont: { size: 12 },
                            callbacks: {
                                // Show anonymized initials and department in tooltip title
                                title: (tooltipItems) => {
                                    if (tooltipItems.length > 0) {
                                        const user = finalUsers[tooltipItems[0].dataIndex];
                                        return user.initials + ' (' + user.department + ')';
                                    }
                                    return '';
                                },
                                // Remove spacing
                                afterTitle: () => {
                                    return '';
                                },
                                // Format each product line: "Product Name: $amount"
                                label: (context) => {
                                    const user = finalUsers[context.dataIndex];
                                    const product = context.dataset.label;
                                    const amount = user[product] || 0;
                                    
                                    if (amount > 0) {
                                        return product + ': $' + amount.toFixed(2);
                                    }
                                    return '';
                                },
                                // Only show products with spend > 0
                                filter: (context) => {
                                    const user = finalUsers[context.dataIndex];
                                    const product = context.dataset.label;
                                    const amount = user[product] || 0;
                                    return amount > 0;
                                }
                            }
                        }
                    },
                    // Handle hover events for pie chart display
                    onHover: (event, activeElements) => {
                        const canvas = event.native.target;
                        if (activeElements.length > 0 && event.type === 'mousemove') {
                            const index = activeElements[0].index;
                            // Get the actual user from the formatted data
                            const finalUsers = formatData();
                            const user = finalUsers[index];
                            // Check if pie chart should show (inverts if Ctrl pressed)
                            const shouldShow = ctrlPressed ? !pieChartEnabled : pieChartEnabled;
                            if (shouldShow && user) {
                                // Position relative to viewport, offset from cursor
                                const x = event.native.clientX + 12;
                                const y = event.native.clientY + 12;
                                showPieChart(user, x, y);
                            } else {
                                hidePieChart();
                            }
                        } else if (event.type === 'mouseleave') {
                            hidePieChart();
                        }
                    },
                    // Handle click to exclude user
                    onClick: (event, elements) => {
                        if (elements && elements.length > 0) {
                            const index = elements[0].index;
                            const finalUsers = formatData();
                            const user = finalUsers[index];
                            // Only exclude individual users, not grouped rows
                            if (user && !user.email.startsWith('grouped')) {
                                hidePieChart();
                                excludeUser(user.email);
                            }
                        }
                    }
                }
            });

            // Update all sidebar panels with new data
            updateSidebar();
        }

        // ============ CONTROL SETUP ============
        // Dynamically create product filter checkboxes
        function setupControls() {
            const controlsDiv = document.getElementById('controls');
            if (!controlsDiv) return;
            
            // Create checkbox for each product
            data.products.forEach(product => {
                const item = document.createElement('div');
                item.className = 'checkbox-item';
                
                // Checkbox input
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'product-' + product;
                checkbox.checked = true; // All products visible by default
                
                // Update visible products on change
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        visibleProducts.add(product);
                    } else {
                        visibleProducts.delete(product);
                    }
                    renderChart();
                });
                
                // Label with color box and product name
                const label = document.createElement('label');
                label.htmlFor = 'product-' + product;
                
                const colorBox = document.createElement('span');
                colorBox.className = 'color-box';
                colorBox.style.backgroundColor = productColors[product]; // Color matched to chart
                
                label.appendChild(colorBox);
                label.appendChild(document.createTextNode(product));
                
                // Add to DOM
                item.appendChild(checkbox);
                item.appendChild(label);
                controlsDiv.appendChild(item);
            });
        }

        // ============ EVENT LISTENERS ============
        // Sort mode dropdown
        document.getElementById('sortBy').addEventListener('change', (e) => {
            sortMode = e.target.value;
            renderChart();
        });

        // Logarithmic scale toggle
        document.getElementById('logScale').addEventListener('change', (e) => {
            logScale = e.target.checked;
            renderChart();
        });

        // Pie chart on hover toggle
        document.getElementById('enablePieChart').addEventListener('change', (e) => {
            pieChartEnabled = e.target.checked;
        });

        // Group threshold slider
        document.getElementById('groupThreshold').addEventListener('input', (e) => {
            groupThreshold = parseInt(e.target.value);
            document.getElementById('groupValue').textContent = '$' + groupThreshold;
            renderChart();
        });

        // Initialize on DOM ready
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
